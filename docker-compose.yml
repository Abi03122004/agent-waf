version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_waf_backend
    ports:
      - "8000:8000"
    environment:
      - SHADOW_MODE=false
      - DATABASE_PATH=agent_waf.db
    volumes:
      - sqlite_data:/app

volumes:
  sqlite_data:
